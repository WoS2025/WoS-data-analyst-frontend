<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test</h1>
    <button onclick="testRegister()">Test Register</button>
    <button onclick="testLogin()">Test Login</button>
    <div id="result"></div>

    <script>
        async function testRegister() {
            const result = document.getElementById('result');
            try {
                const response = await fetch('http://127.0.0.1:5000/user/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'testuser',
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });
                
                const data = await response.json();
                result.innerHTML = `Register: ${JSON.stringify(data)}`;
            } catch (error) {
                result.innerHTML = `Register Error: ${error.message}`;
            }
        }

        async function testLogin() {
            const result = document.getElementById('result');
            try {
                const response = await fetch('http://127.0.0.1:5000/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });
                
                const data = await response.json();
                result.innerHTML = `Login: ${JSON.stringify(data)}`;
            } catch (error) {
                result.innerHTML = `Login Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
